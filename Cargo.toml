[package]
name = "foxtail"
version = "0.1.0"
edition = "2021"
description = "Real-time log file viewer for Windows"
license = "MIT"
readme = "README.md"
keywords = ["log", "tail", "viewer", "windows"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
eframe = "0.36"
egui = "0.36"
encoding_rs = "0.8"
regex = "1"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"
